<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0b1229"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .line1 {
        font: 600 26px 'Segoe UI', Verdana, sans-serif;
        fill: #94a3b8;
        opacity: 0;
        animation: fadeIn 0.8s ease forwards;
        animation-delay: 0.1s;
      }
      .line2 {
        font: 800 46px 'Segoe UI', Verdana, sans-serif;
        fill: url(#textGrad);
        filter: url(#glow);
        stroke-dasharray: 900;
        stroke-dashoffset: 900;
        animation: draw 2.4s ease forwards, fadeIn 0.4s ease forwards;
        animation-delay: 0.6s, 0.6s;
      }
      .line3 {
        font: 500 18px 'Segoe UI', Verdana, sans-serif;
        fill: #cbd5e1;
        opacity: 0;
        animation: fadeIn 1s ease forwards;
        animation-delay: 2.6s;
      }
      .cursor {
        animation: blink 1s steps(2, start) infinite;
      }
      .dot {
        animation: float 4s ease-in-out infinite;
      }
      @keyframes fadeIn { to { opacity: 1; } }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </defs>

  <rect width="900" height="220" rx="18" fill="url(#bgGrad)"/>

  <circle class="dot" cx="820" cy="40" r="3" fill="#38bdf8" opacity="0.7" style="animation-delay:0s"/>
  <circle class="dot" cx="850" cy="90" r="2" fill="#8b5cf6" opacity="0.6" style="animation-delay:1s"/>
  <circle class="dot" cx="60" cy="180" r="2.5" fill="#22d3ee" opacity="0.6" style="animation-delay:2s"/>
  <circle class="dot" cx="40" cy="50" r="2" fill="#3b82f6" opacity="0.5" style="animation-delay:0.5s"/>

  <text x="60" y="70" class="line1">Hi there, I'm</text>

  <text x="58" y="130" class="line2" stroke="url(#textGrad)" stroke-width="1">
    Vishal Purushothaman<tspan class="cursor">|</tspan>
  </text>

  <text x="60" y="170" class="line3">Full-Stack Developer • Mobile App Enthusiast • AI/ML Explorer</text>
</svg>
